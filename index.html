<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立科技高中─校園社團介紹</title>
    <style>
        #main {
            /* 整體網站尺寸 */
            width: 1024px;
            height: 768px;
            /* 水平置中 */
            margin: auto;
            /* background-color: lightblue; */
        }

        #top {
            width: 1000px;
            height: 65px;
            margin: auto;
            /* background-color: lightcoral; */
        }

        #left {
            width: 215px;
            /* calc可以計算 */
            /*  + 、 - 、 * 、 / 左右兩側要半形空白 */
            height: calc(768px - 65px - 20px);
            margin-left: 12px;
            /* background-color: lightgoldenrodyellow; */
            float: left;
        }

        #menu {
            width: 215px;
            height: calc(768px - 65px - 20px - 25px);
            /* background-color: lightgreen; */
        }

        #menu div {
            font-family: '標楷體';
            font-size: 24px;
            color: #ff00ff;
            font-weight: 500;
            text-decoration: underline;
            text-align: center;
        }

        #menu td {
            width: 215px;
            height: 40px;
            text-align: center;
            font-family: '標楷體';
            font-size: 16px;
            color: #000;
            background: url("./images/menu1.png") no-repeat center;
        }

        /* 可以不做 ，讓連結字連同圖片都可以點*/
        #menu a {
            display: block;
            line-height: 40px;
        }

        #menu td:hover {
            width: 215px;
            height: 40px;
            text-align: center;
            font-family: '標楷體';
            font-size: 16px;
            color: #000;
            background: url("./images/menu2.png") no-repeat center;
        }

        #update {
            width: 215px;
            height: 25px;
            /* background-color: blue; */
            font-family: '標楷體';
            font-size: 16px;
            color: #000;
            text-align: center;
        }

        #right {
            width: 770px;
            height: calc(768px - 65px - 20px);
            /* background-color: lightseagreen; */
            margin-right: 12px;
            float: right;
        }

        marquee {
            width: 770px;
            height: 29px;
            /* background-color: lightslategray; */
            /* 考試可以不寫，處理掉marquee下方空白 */
            vertical-align: middle;
            font-family: '標楷體';
            font-size: 24px;
            color: #0000FF;

        }

        iframe {
            width: 770px;
            height: calc(768px - 65px - 29px - 20px);
            /* background-color: lightsalmon; */
        }

        #footer {
            width: 1000px;
            height: 20px;
            margin: auto;
            /* background-color: rgb(255, 0, 0); */
            clear: both;
            font-family: '標楷體';
            font-size: 16px;
            color: #000;
            text-align: center;

        }
    </style>
</head>

<body>
    <div id="main">
        <div id="top">
            <a href="#"><img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網"></a>
        </div>
        <div id="left">
            <div id="menu">
                <div>社團介紹</div>
                <table>
                    <tr>
                        <td><a href="./guitar_history.html" target="iframe">吉他社</a></td>
                    </tr>
                    <tr>
                        <td>熱舞社</td>
                    </tr>
                    <tr>
                        <td>棒球社</td>
                    </tr>
                    <tr>
                        <td>羽球社</td>
                    </tr>
                    <tr>
                        <td>足球社</td>
                    </tr>
                    <tr>
                        <td>童軍社</td>
                    </tr>
                </table>
            </div>
            <div id="update">最近更新日期：2026/11/27</div>
        </div>
        <div id="right">
            <marquee>歡迎光臨校園社團介紹網，參觀後請支持社團活動並熱烈參與</marquee>
            <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
        </div>
        <div id="footer">網頁設計及維護：13藍玟琪</div>
    </div>
</body>

</html>
